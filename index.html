<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Action — Plan, focus, finish</title>
    <meta
      name="description"
      content="Action is a keyboard-first task manager with natural-language capture, a planning board, a focus timer and honest productivity analytics."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0f16" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="Action — Plan, focus, finish" />
    <meta property="og:description" content="A keyboard-first task manager with planning, focus and analytics built in." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Apply the stored theme before first paint so the app never flashes the
      wrong colour scheme. Kept inline and tiny on purpose.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('action.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* private mode / storage disabled — fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
